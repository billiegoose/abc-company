  <title id="title">ANANA pineapple logo</title>
  <desc id="desc">Five green leaves above a golden pineapple with open diamond lattice and horizontal orange color bands. Heavy geometric ANANA lettering with mirrored right-triangle outer As, a symmetric middle A centered beneath the pineapple, enlarged triangular counters, and three horizontal cuts.</desc>
